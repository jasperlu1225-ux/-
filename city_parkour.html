<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城市跑酷</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #87CEEB;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        #gameContainer {
            width: 100%;
            height: 600px;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            position: relative;
            overflow: hidden;
            touch-action: none;
        }

        .ui-panel {
            background-color: #333;
            color: #fff;
            padding: 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 18px;
        }

        .ui-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

        button:active {
            transform: scale(0.98);
        }

        .mobile-controls {
            display: none;
            position: absolute;
            bottom: 20px;
            width: 100%;
            justify-content: space-around;
            padding: 0 20px;
            z-index: 100;
        }

        .mobile-controls.visible {
            display: flex;
        }

        .control-btn {
            width: 60px;
            height: 60px;
            background-color: rgba(76, 175, 80, 0.7);
            border: 3px solid #fff;
            border-radius: 50%;
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            transition: background-color 0.1s;
        }

        .control-btn:active {
            background-color: rgba(76, 175, 80, 1);
        }

        #gameOver {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            z-index: 200;
            min-width: 250px;
        }

        #gameOver h2 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        #gameOver p {
            font-size: 20px;
            margin: 10px 0;
        }

        #gameOver button {
            margin-top: 20px;
            font-size: 18px;
            padding: 15px 30px;
        }

        .checkpoint-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            color: #FFD700;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 50;
        }

        @media (max-width: 600px) {
            #gameContainer {
                height: 500px;
            }

            .ui-panel {
                flex-direction: column;
                gap: 10px;
            }

            .button-group {
                width: 100%;
                flex-wrap: wrap;
            }

            button {
                flex: 1;
                min-width: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="gameContainer">
            <div class="checkpoint-indicator">檢查點: <span id="checkpointCount">0</span></div>
            <div class="mobile-controls" id="mobileControls">
                <div class="control-btn" id="leftBtn">←</div>
                <div class="control-btn" id="jumpBtn">↑</div>
                <div class="control-btn" id="rightBtn">→</div>
            </div>
            <div id="gameOver">
                <h2 id="gameOverTitle">遊戲結束</h2>
                <p>最後得分: <span id="finalScore">0</span></p>
                <p>通過檢查點: <span id="finalCheckpoints">0</span></p>
                <button onclick="game.restart()">重新開始</button>
            </div>
        </div>
        <div class="ui-panel">
            <div class="ui-item">分數: <span id="score">0</span></div>
            <div class="ui-item">生命值: <span id="health">3</span></div>
            <div class="ui-item">關卡: <span id="level">1</span></div>
        </div>
        <div class="button-group">
            <button onclick="game.togglePause()">暫停/繼續</button>
            <button onclick="toggleMobileControls()">移動控制</button>
            <button onclick="game.restart()">重新開始</button>
        </div>
    </div>

    <script>
        class Game {
            constructor() {
                this.canvas = document.getElementById('gameContainer');
                this.width = this.canvas.offsetWidth;
                this.height = this.canvas.offsetHeight;
                this.gravity = 0.6;
                this.isPaused = false;
                this.score = 0;
                this.health = 3;
                this.level = 1;
                this.checkpointsReached = 0;
                this.gameOverFlag = false;

                this.player = {
                    x: 50,
                    y: this.height - 150,
                    width: 30,
                    height: 40,
                    velocityY: 0,
                    velocityX: 0,
                    isJumping: false,
                    color: '#FF6B6B'
                };

                this.keys = {
                    ArrowLeft: false,
                    ArrowRight: false,
                    ArrowUp: false,
                    'a': false,
                    'd': false,
                    'w': false,
                    ' ': false
                };

                this.platforms = [];
                this.obstacles = [];
                this.checkpoints = [];
                this.lastCheckpoint = null;

                this.cameraX = 0;
                this.platformSpeed = -3;

                this.init();
                this.setupEventListeners();
                this.gameLoop();
            }

            init() {
                this.generateLevel();
                this.updateUI();
            }

            generateLevel() {
                this.platforms = [];
                this.obstacles = [];
                this.checkpoints = [];

                const platformGap = 150;
                const numPlatforms = Math.ceil(this.width / platformGap) + 5;

                for (let i = 0; i < numPlatforms; i++) {
                    const x = i * platformGap;
                    const y = Math.random() * (this.height - 200) + 100;
                    this.platforms.push({
                        x: x,
                        y: y,
                        width: 80 + Math.random() * 40,
                        height: 15,
                        color: '#4CAF50'
                    });

                    // 添加檢查點（每5個平台1個）
                    if (i > 0 && i % 5 === 0) {
                        this.checkpoints.push({
                            x: x,
                            y: y - 50,
                            width: 30,
                            height: 50,
                            collected: false
                        });
                    }

                    // 添加障礙物
                    if (i > 2) {
                        const obstacleType = Math.random();
                        if (obstacleType < 0.3) {
                            // 汽車
                            this.obstacles.push({
                                x: x + Math.random() * 200,
                                y: y - 60,
                                width: 50,
                                height: 25,
                                type: 'car',
                                speed: 2 + Math.random() * 2,
                                color: '#FF0000',
                                direction: Math.random() > 0.5 ? 1 : -1
                            });
                        } else if (obstacleType < 0.6) {
                            // 敵人
                            this.obstacles.push({
                                x: x + 100,
                                y: y - 80,
                                width: 25,
                                height: 35,
                                type: 'enemy',
                                speed: 1 + Math.random() * 1.5,
                                color: '#9C27B0',
                                patrolWidth: 150,
                                startX: x + 100
                            });
                        } else {
                            // 陷阱
                            this.obstacles.push({
                                x: x + 40,
                                y: y + 15,
                                width: 60,
                                height: 20,
                                type: 'trap',
                                color: '#FFD700'
                            });
                        }
                    }
                }

                // 初始起始平台
                this.platforms.unshift({
                    x: -100,
                    y: this.height - 100,
                    width: 120,
                    height: 15,
                    color: '#4CAF50'
                });
            }

            setupEventListeners() {
                document.addEventListener('keydown', (e) => {
                    if (e.key in this.keys) {
                        this.keys[e.key] = true;
                    }
                    if (e.key === ' ') {
                        e.preventDefault();
                        this.keys[' '] = true;
                    }
                });

                document.addEventListener('keyup', (e) => {
                    if (e.key in this.keys) {
                        this.keys[e.key] = false;
                    }
                    if (e.key === ' ') {
                        this.keys[' '] = false;
                    }
                });

                // 移動控制按鈕
                document.getElementById('leftBtn').addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    this.keys['ArrowLeft'] = true;
                });
                document.getElementById('leftBtn').addEventListener('touchend', (e) => {
                    e.preventDefault();
                    this.keys['ArrowLeft'] = false;
                });

                document.getElementById('rightBtn').addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    this.keys['ArrowRight'] = true;
                });
                document.getElementById('rightBtn').addEventListener('touchend', (e) => {
                    e.preventDefault();
                    this.keys['ArrowRight'] = false;
                });

                document.getElementById('jumpBtn').addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    this.keys[' '] = true;
                });
                document.getElementById('jumpBtn').addEventListener('touchend', (e) => {
                    e.preventDefault();
                    this.keys[' '] = false;
                });
            }

            update() {
                if (this.isPaused || this.gameOverFlag) return;

                // 玩家移動
                this.player.velocityX = 0;
                if (this.keys['ArrowLeft'] || this.keys['a']) {
                    this.player.velocityX = -5;
                }
                if (this.keys['ArrowRight'] || this.keys['d']) {
                    this.player.velocityX = 5;
                }

                this.player.x += this.player.velocityX;

                // 重力
                this.player.velocityY += this.gravity;
                this.player.y += this.player.velocityY;

                // 邊界檢查
                if (this.player.x < 0) this.player.x = 0;
                if (this.player.x + this.player.width > this.width) {
                    this.player.x = this.width - this.player.width;
                }

                // 檢查平台碰撞
                let onGround = false;
                this.platforms.forEach(platform => {
                    if (
                        this.player.velocityY >= 0 &&
                        this.player.y + this.player.height >= platform.y &&
                        this.player.y + this.player.height <= platform.y + platform.height + 5 &&
                        this.player.x + this.player.width > platform.x &&
                        this.player.x < platform.x + platform.width
                    ) {
                        this.player.y = platform.y - this.player.height;
                        this.player.velocityY = 0;
                        this.player.isJumping = false;
                        onGround = true;
                    }
                });

                // 跳躍
                if ((this.keys[' '] || this.keys['w'] || this.keys['ArrowUp']) && !this.player.isJumping && onGround) {
                    this.player.velocityY = -12;
                    this.player.isJumping = true;
                }

                // 檢查障礙物碰撞
                this.obstacles.forEach(obstacle => {
                    if (this.checkCollision(this.player, obstacle)) {
                        this.takeDamage();
                        this.resetPlayerPosition();
                    }

                    // 更新障礙物位置
                    if (obstacle.type === 'car') {
                        obstacle.x += obstacle.speed * obstacle.direction;
                        if (obstacle.x > this.width + 50) obstacle.x = -50;
                        if (obstacle.x < -50) obstacle.x = this.width + 50;
                    } else if (obstacle.type === 'enemy') {
                        obstacle.x += obstacle.speed;
                        if (obstacle.x - obstacle.startX > obstacle.patrolWidth) {
                            obstacle.speed = -obstacle.speed;
                        }
                        if (obstacle.x - obstacle.startX < 0) {
                            obstacle.speed = -obstacle.speed;
                        }
                    }
                });

                // 檢查檢查點
                this.checkpoints.forEach(checkpoint => {
                    if (!checkpoint.collected && this.checkCollision(this.player, checkpoint)) {
                        checkpoint.collected = true;
                        this.checkpointsReached++;
                        this.score += 100;
                        this.lastCheckpoint = {
                            x: checkpoint.x,
                            y: checkpoint.y
                        };
                        this.updateUI();
                    }
                });

                // 掉出屏幕
                if (this.player.y > this.height) {
                    this.takeDamage();
                    this.resetPlayerPosition();
                }

                // 更新相機
                this.cameraX = this.player.x - 100;
                if (this.cameraX < 0) this.cameraX = 0;

                // 增加得分
                this.score += 0.1;

                // 關卡提升
                if (this.checkpointsReached > 0 && this.checkpointsReached % 3 === 0) {
                    this.level = Math.floor(this.checkpointsReached / 3) + 1;
                }

                this.updateUI();

                // 檢查遊戲結束
                if (this.health <= 0) {
                    this.gameOver();
                }
            }

            checkCollision(rect1, rect2) {
                return (
                    rect1.x < rect2.x + rect2.width &&
                    rect1.x + rect1.width > rect2.x &&
                    rect1.y < rect2.y + rect2.height &&
                    rect1.y + rect1.height > rect2.y
                );
            }

            takeDamage() {
                this.health--;
                this.score = Math.max(0, this.score - 50);
            }

            resetPlayerPosition() {
                if (this.lastCheckpoint) {
                    this.player.x = this.lastCheckpoint.x;
                    this.player.y = this.lastCheckpoint.y - 100;
                } else {
                    this.player.x = 50;
                    this.player.y = this.height - 150;
                }
                this.player.velocityY = 0;
                this.player.velocityX = 0;
            }

            draw() {
                // 清空背景（已通過CSS處理）
                
                // 繪製平台
                this.platforms.forEach(platform => {
                    this.drawRect(platform.x - this.cameraX, platform.y, platform.width, platform.height, platform.color);
                });

                // 繪製障礙物
                this.obstacles.forEach(obstacle => {
                    if (obstacle.type === 'car') {
                        this.drawCar(obstacle.x - this.cameraX, obstacle.y, obstacle.width, obstacle.height, obstacle.color);
                    } else if (obstacle.type === 'enemy') {
                        this.drawEnemy(obstacle.x - this.cameraX, obstacle.y, obstacle.width, obstacle.height, obstacle.color);
                    } else if (obstacle.type === 'trap') {
                        this.drawTrap(obstacle.x - this.cameraX, obstacle.y, obstacle.width, obstacle.height, obstacle.color);
                    }
                });

                // 繪製檢查點
                this.checkpoints.forEach(checkpoint => {
                    if (!checkpoint.collected) {
                        this.drawFlag(checkpoint.x - this.cameraX, checkpoint.y, checkpoint.collected);
                    }
                });

                // 繪製玩家
                this.drawRect(this.player.x - this.cameraX, this.player.y, this.player.width, this.player.height, this.player.color);
            }

            drawRect(x, y, width, height, color) {
                const div = document.createElement('div');
                div.style.position = 'absolute';
                div.style.left = x + 'px';
                div.style.top = y + 'px';
                div.style.width = width + 'px';
                div.style.height = height + 'px';
                div.style.backgroundColor = color;
                div.style.border = '2px solid #000';
                this.canvas.appendChild(div);
            }

            drawCar(x, y, width, height, color) {
                const div = document.createElement('div');
                div.style.position = 'absolute';
                div.style.left = x + 'px';
                div.style.top = y + 'px';
                div.style.width = width + 'px';
                div.style.height = height + 'px';
                div.style.backgroundColor = color;
                div.style.border = '2px solid #000';
                div.style.borderRadius = '3px';
                div.textContent = '🚗';
                div.style.fontSize = '20px';
                div.style.display = 'flex';
                div.style.alignItems = 'center';
                div.style.justifyContent = 'center';
                this.canvas.appendChild(div);
            }

            drawEnemy(x, y, width, height, color) {
                const div = document.createElement('div');
                div.style.position = 'absolute';
                div.style.left = x + 'px';
                div.style.top = y + 'px';
                div.style.width = width + 'px';
                div.style.height = height + 'px';
                div.style.backgroundColor = color;
                div.style.border = '2px solid #000';
                div.style.borderRadius = '5px';
                div.textContent = '👾';
                div.style.fontSize = '24px';
                div.style.display = 'flex';
                div.style.alignItems = 'center';
                div.style.justifyContent = 'center';
                this.canvas.appendChild(div);
            }

            drawTrap(x, y, width, height, color) {
                const div = document.createElement('div');
                div.style.position = 'absolute';
                div.style.left = x + 'px';
                div.style.top = y + 'px';
                div.style.width = width + 'px';
                div.style.height = height + 'px';
                div.style.backgroundColor = color;
                div.style.border = '2px dashed #000';
                div.textContent = '⚠️';
                div.style.fontSize = '18px';
                div.style.display = 'flex';
                div.style.alignItems = 'center';
                div.style.justifyContent = 'center';
                this.canvas.appendChild(div);
            }

            drawFlag(x, y, collected) {
                const div = document.createElement('div');
                div.style.position = 'absolute';
                div.style.left = x + 'px';
                div.style.top = y + 'px';
                div.style.width = '30px';
                div.style.height = '50px';
                div.textContent = collected ? '🚩' : '🚩';
                div.style.fontSize = '30px';
                div.style.display = 'flex';
                div.style.alignItems = 'center';
                div.style.justifyContent = 'center';
                div.style.filter = collected ? 'grayscale(100%)' : '';
                this.canvas.appendChild(div);
            }

            updateUI() {
                document.getElementById('score').textContent = Math.floor(this.score);
                document.getElementById('health').textContent = this.health;
                document.getElementById('level').textContent = this.level;
                document.getElementById('checkpointCount').textContent = this.checkpointsReached;
            }

            togglePause() {
                this.isPaused = !this.isPaused;
            }

            gameOver() {
                this.gameOverFlag = true;
                document.getElementById('gameOver').style.display = 'block';
                document.getElementById('finalScore').textContent = Math.floor(this.score);
                document.getElementById('finalCheckpoints').textContent = this.checkpointsReached;
            }

            restart() {
                this.score = 0;
                this.health = 3;
                this.level = 1;
                this.checkpointsReached = 0;
                this.gameOverFlag = false;
                this.lastCheckpoint = null;
                this.player.x = 50;
                this.player.y = this.height - 150;
                this.player.velocityY = 0;
                this.player.velocityX = 0;
                document.getElementById('gameOver').style.display = 'none';
                this.generateLevel();
                this.updateUI();
            }

            gameLoop() {
                // 清空遊戲容器中的繪製元素
                const gameContainer = document.getElementById('gameContainer');
                const children = gameContainer.querySelectorAll('div[style*="position: absolute"]');
                children.forEach(child => {
                    if (child.id !== 'gameOver' && child.id !== 'mobileControls' && !child.classList.contains('checkpoint-indicator')) {
                        child.remove();
                    }
                });

                this.update();
                this.draw();

                requestAnimationFrame(() => this.gameLoop());
            }
        }

        let game;

        window.addEventListener('load', () => {
            game = new Game();
            
            // 檢測是否是移動設備
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            if (isMobile) {
                document.getElementById('mobileControls').classList.add('visible');
            }
        });

        function toggleMobileControls() {
            document.getElementById('mobileControls').classList.toggle('visible');
        }
    </script>
</body>
</html>
