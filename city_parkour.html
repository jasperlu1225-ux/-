<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城市跑酷 - 完整版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 32px;
            font-weight: bold;
        }

        #gameContainer {
            width: 100%;
            height: 600px;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 50%, #90EE90 100%);
            position: relative;
            overflow: hidden;
            touch-action: none;
        }

        .stats-panel {
            background: #222;
            color: white;
            padding: 15px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            font-size: 16px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-label {
            color: #aaa;
            font-weight: bold;
            font-size: 14px;
        }

        .stat-value {
            color: #4CAF50;
            font-size: 22px;
            font-weight: bold;
        }

        .controls-panel {
            background: #333;
            padding: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            background: linear-gradient(to right, #4CAF50, #45a049);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .mobile-controls {
            display: none;
            position: absolute;
            bottom: 20px;
            width: 100%;
            justify-content: space-around;
            padding: 0 20px;
            z-index: 100;
        }

        .mobile-controls.visible {
            display: flex;
        }

        .touch-btn {
            width: 70px;
            height: 70px;
            background: rgba(76, 175, 80, 0.8);
            border: 3px solid white;
            border-radius: 50%;
            color: white;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            touch-action: manipulation;
        }

        .touch-btn:active {
            background: rgba(76, 175, 80, 1);
            transform: scale(0.9);
        }

        #gameOverModal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        #gameOverModal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            min-width: 300px;
        }

        .modal-content h2 {
            font-size: 48px;
            color: #e74c3c;
            margin-bottom: 20px;
        }

        .modal-content p {
            font-size: 18px;
            color: #333;
            margin: 10px 0;
        }

        .modal-content button {
            margin-top: 20px;
            background: linear-gradient(to right, #3498db, #2980b9);
        }

        .info-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.7);
            color: #FFD700;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 50;
        }

        .game-object {
            position: absolute;
        }

        .platform {
            background-color: #32CD32;
            border: 2px solid #000;
            border-radius: 3px;
        }

        .player {
            font-size: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .car {
            background-color: #FF0000;
            border: 2px solid #000;
            border-radius: 3px;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .enemy {
            background-color: #9C27B0;
            border: 2px solid #000;
            border-radius: 5px;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .trap {
            background-color: #FFD700;
            border: 2px dashed #000;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spike {
            background-color: #FF6347;
            border: 2px solid #000;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .checkpoint {
            font-size: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 600px) {
            #gameContainer {
                height: 500px;
            }

            .stats-panel {
                grid-template-columns: repeat(2, 1fr);
            }

            button {
                padding: 10px 16px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">🏙️ 城市跑酷 - 完整版 🏃</div>
        
        <div id="gameContainer">
            <div class="info-panel">
                <div>關卡: <span id="levelInfo">1</span></div>
                <div>檢查點: <span id="checkpointInfo">0</span></div>
            </div>
            <div class="mobile-controls" id="mobileControls">
                <div class="touch-btn" id="leftBtn">⬅️</div>
                <div class="touch-btn" id="jumpBtn">⬆️</div>
                <div class="touch-btn" id="rightBtn">➡️</div>
            </div>
            <div id="gameOverModal">
                <div class="modal-content">
                    <h2>遊戲結束!</h2>
                    <p>最終分數: <strong id="finalScore">0</strong></p>
                    <p>通過檢查點: <strong id="finalCheckpoints">0</strong></p>
                    <p>最高關卡: <strong id="finalLevel">1</strong></p>
                    <p>最高分記錄: <strong id="bestScore">0</strong></p>
                    <button onclick="game.restart()">重新開始</button>
                </div>
            </div>
        </div>

        <div class="stats-panel">
            <div class="stat-item">
                <span class="stat-label">💯 分數</span>
                <span class="stat-value" id="score">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">❤️ 生命</span>
                <span class="stat-value" id="health">3</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">⭐ 關卡</span>
                <span class="stat-value" id="level">1</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">🏆 最高分</span>
                <span class="stat-value" id="bestScoreDisplay">0</span>
            </div>
        </div>

        <div class="controls-panel">
            <button onclick="game.togglePause()">⏸️ 暫停/繼續</button>
            <button onclick="toggleMobileControls()">📱 移動控制</button>
            <button onclick="game.restart()">🔄 重新開始</button>
            <button onclick="clearBestScore()">🗑️ 清除記錄</button>
        </div>
    </div>

    <script>
        class CityParkourGame {
            constructor() {
                this.canvas = document.getElementById('gameContainer');
                this.width = this.canvas.offsetWidth;
                this.height = this.canvas.offsetHeight;

                // 遊戲狀態
                this.isPaused = false;
                this.isGameOver = false;
                this.score = 0;
                this.health = 3;
                this.level = 1;
                this.checkpointsReached = 0;
                this.bestScore = localStorage.getItem('bestScore') ? parseInt(localStorage.getItem('bestScore')) : 0;

                // 物理引擎
                this.gravity = 0.5;

                // 玩家對象
                this.player = {
                    x: 60,
                    y: this.height - 150,
                    width: 25,
                    height: 35,
                    velocityX: 0,
                    velocityY: 0,
                    isJumping: false
                };

                // 鍵盤輸入
                this.keys = {};

                // 遊戲對象
                this.platforms = [];
                this.obstacles = [];
                this.checkpoints = [];
                this.lastCheckpointX = null;

                // 初始化
                this.setupInputListeners();
                this.generateLevel();
                this.updateUI();
                this.gameLoop();
            }

            setupInputListeners() {
                // 鍵盤控制
                document.addEventListener('keydown', (e) => {
                    this.keys[e.key] = true;
                });
                document.addEventListener('keyup', (e) => {
                    this.keys[e.key] = false;
                });

                // 觸摸按鈕
                this.setupTouchBtn('leftBtn', 'left');
                this.setupTouchBtn('rightBtn', 'right');
                this.setupTouchBtn('jumpBtn', 'jump');
            }

            setupTouchBtn(btnId, action) {
                const btn = document.getElementById(btnId);
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    this.keys[action] = true;
                });
                btn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    this.keys[action] = false;
                });
                btn.addEventListener('mousedown', () => this.keys[action] = true);
                btn.addEventListener('mouseup', () => this.keys[action] = false);
            }

            generateLevel() {
                this.platforms = [];
                this.obstacles = [];
                this.checkpoints = [];

                // 起始平台
                this.platforms.push({
                    x: 0,
                    y: this.height - 100,
                    width: 150,
                    height: 25
                });

                // 生成關卡
                const platformGap = 130;
                const totalPlatforms = 80 + this.level * 5;

                for (let i = 1; i < totalPlatforms; i++) {
                    const px = 150 + i * platformGap;
                    const py = Math.random() * (this.height - 300) + 150;

                    // 平台
                    this.platforms.push({
                        x: px,
                        y: py,
                        width: 70 + Math.random() * 40,
                        height: 18
                    });

                    // 檢查點（旗子）
                    if (i % 4 === 0) {
                        this.checkpoints.push({
                            x: px + 20,
                            y: py - 50,
                            width: 25,
                            height: 40,
                            collected: false
                        });
                    }

                    // 障礙物（從第5個平台開始）
                    if (i > 4) {
                        const rand = Math.random();
                        const speed = 2 + this.level * 0.5;

                        if (rand < 0.25) {
                            // 汽車
                            this.obstacles.push({
                                type: 'car',
                                x: px + Math.random() * this.width,
                                y: py - 50,
                                width: 55,
                                height: 28,
                                speed: speed + 1,
                                direction: Math.random() > 0.5 ? 1 : -1
                            });
                        } else if (rand < 0.5) {
                            // 敵人
                            this.obstacles.push({
                                type: 'enemy',
                                x: px,
                                y: py - 60,
                                width: 28,
                                height: 38,
                                speed: speed * 0.8,
                                minX: px - 120,
                                maxX: px + 120,
                                direction: 1
                            });
                        } else if (rand < 0.75) {
                            // 陷阱
                            this.obstacles.push({
                                type: 'trap',
                                x: px + 10,
                                y: py + 20,
                                width: 60,
                                height: 12
                            });
                        } else {
                            // 電刺
                            this.obstacles.push({
                                type: 'spike',
                                x: px + 25,
                                y: py - 18,
                                width: 12,
                                height: 18
                            });
                        }
                    }
                }
            }

            update() {
                if (this.isPaused || this.isGameOver) return;

                // 玩家移動
                this.player.velocityX = 0;
                if (this.keys['ArrowLeft'] || this.keys['a'] || this.keys['left']) {
                    this.player.velocityX = -6;
                }
                if (this.keys['ArrowRight'] || this.keys['d'] || this.keys['right']) {
                    this.player.velocityX = 6;
                }
                this.player.x += this.player.velocityX;

                // 重力
                this.player.velocityY += this.gravity;
                this.player.y += this.player.velocityY;

                // 邊界檢查
                if (this.player.x < 0) this.player.x = 0;
                if (this.player.x + this.player.width > this.width) {
                    this.player.x = this.width - this.player.width;
                }

                // 平台碰撞
                let onGround = false;
                for (let platform of this.platforms) {
                    if (
                        this.player.velocityY >= 0 &&
                        this.player.y + this.player.height >= platform.y &&
                        this.player.y + this.player.height <= platform.y + platform.height + 5 &&
                        this.player.x + this.player.width > platform.x &&
                        this.player.x < platform.x + platform.width
                    ) {
                        this.player.y = platform.y - this.player.height;
                        this.player.velocityY = 0;
                        this.player.isJumping = false;
                        onGround = true;
                    }
                }

                // 跳躍
                if ((this.keys[' '] || this.keys['w'] || this.keys['ArrowUp'] || this.keys['jump']) && 
                    !this.player.isJumping && onGround) {
                    this.player.velocityY = -12;
                    this.player.isJumping = true;
                }

                // 檢查點碰撞
                for (let checkpoint of this.checkpoints) {
                    if (!checkpoint.collected && this.checkCollision(this.player, checkpoint)) {
                        checkpoint.collected = true;
                        this.checkpointsReached++;
                        this.score += 100;
                        this.lastCheckpointX = checkpoint.x;
                    }
                }

                // 障礙物更新和碰撞
                for (let obstacle of this.obstacles) {
                    if (obstacle.type === 'car') {
                        obstacle.x += obstacle.speed * obstacle.direction;
                        if (obstacle.x > this.width + 50) obstacle.x = -60;
                        if (obstacle.x < -60) obstacle.x = this.width + 50;
                    } else if (obstacle.type === 'enemy') {
                        obstacle.x += obstacle.speed * obstacle.direction;
                        if (obstacle.x < obstacle.minX || obstacle.x > obstacle.maxX) {
                            obstacle.direction *= -1;
                        }
                    }

                    if (this.checkCollision(this.player, obstacle)) {
                        this.takeDamage();
                    }
                }

                // 掉出屏幕
                if (this.player.y > this.height) {
                    this.takeDamage();
                }

                // 得分增加
                this.score += 0.1;

                // 等級提升
                if (this.checkpointsReached > 0 && this.checkpointsReached % 5 === 0) {
                    this.level = Math.floor(this.checkpointsReached / 5) + 1;
                }

                this.updateUI();

                if (this.health <= 0) {
                    this.gameOver();
                }
            }

            checkCollision(rect1, rect2) {
                return (
                    rect1.x < rect2.x + rect2.width &&
                    rect1.x + rect1.width > rect2.x &&
                    rect1.y < rect2.y + rect2.height &&
                    rect1.y + rect1.height > rect2.y
                );
            }

            takeDamage() {
                this.health--;
                this.score = Math.max(0, this.score - 30);
                this.resetPlayer();
            }

            resetPlayer() {
                if (this.lastCheckpointX !== null) {
                    this.player.x = this.lastCheckpointX;
                } else {
                    this.player.x = 60;
                }
                this.player.y = this.height - 150;
                this.player.velocityY = 0;
                this.player.velocityX = 0;
            }

            draw() {
                // 清空舊元素
                const gameContainer = document.getElementById('gameContainer');
                const children = gameContainer.querySelectorAll('.game-object');
                children.forEach(child => child.remove());

                // 繪製平台
                for (let platform of this.platforms) {
                    this.drawElement(platform.x, platform.y, platform.width, platform.height, 'platform', '');
                }

                // 繪製檢查點
                for (let checkpoint of this.checkpoints) {
                    if (!checkpoint.collected) {
                        this.drawElement(checkpoint.x, checkpoint.y, checkpoint.width, checkpoint.height, 'checkpoint', '🚩');
                    }
                }

                // 繪製障礙物
                for (let obstacle of this.obstacles) {
                    let emoji = '';
                    if (obstacle.type === 'car') {
                        emoji = '🚗';
                        this.drawElement(obstacle.x, obstacle.y, obstacle.width, obstacle.height, 'car', emoji);
                    } else if (obstacle.type === 'enemy') {
                        emoji = '👾';
                        this.drawElement(obstacle.x, obstacle.y, obstacle.width, obstacle.height, 'enemy', emoji);
                    } else if (obstacle.type === 'trap') {
                        emoji = '⚠️';
                        this.drawElement(obstacle.x, obstacle.y, obstacle.width, obstacle.height, 'trap', emoji);
                    } else if (obstacle.type === 'spike') {
                        emoji = '⚡';
                        this.drawElement(obstacle.x, obstacle.y, obstacle.width, obstacle.height, 'spike', emoji);
                    }
                }

                // 繪製玩家
                this.drawElement(this.player.x, this.player.y, this.player.width, this.player.height, 'player', '🏃');
            }

            drawElement(x, y, width, height, className, emoji) {
                const div = document.createElement('div');
                div.className = `game-object ${className}`;
                div.style.left = x + 'px';
                div.style.top = y + 'px';
                div.style.width = width + 'px';
                div.style.height = height + 'px';
                div.textContent = emoji;
                this.canvas.appendChild(div);
            }

            updateUI() {
                document.getElementById('score').textContent = Math.floor(this.score);
                document.getElementById('health').textContent = this.health;
                document.getElementById('level').textContent = this.level;
                document.getElementById('levelInfo').textContent = this.level;
                document.getElementById('checkpointInfo').textContent = this.checkpointsReached;
                document.getElementById('bestScoreDisplay').textContent = this.bestScore;
            }

            togglePause() {
                this.isPaused = !this.isPaused;
            }

            gameOver() {
                this.isGameOver = true;
                
                // 更新最高分
                if (Math.floor(this.score) > this.bestScore) {
                    this.bestScore = Math.floor(this.score);
                    localStorage.setItem('bestScore', this.bestScore);
                }

                document.getElementById('gameOverModal').classList.add('show');
                document.getElementById('finalScore').textContent = Math.floor(this.score);
                document.getElementById('finalCheckpoints').textContent = this.checkpointsReached;
                document.getElementById('finalLevel').textContent = this.level;
                document.getElementById('bestScore').textContent = this.bestScore;
            }

            restart() {
                this.score = 0;
                this.health = 3;
                this.level = 1;
                this.checkpointsReached = 0;
                this.isGameOver = false;
                this.isPaused = false;
                this.lastCheckpointX = null;
                document.getElementById('gameOverModal').classList.remove('show');
                this.generateLevel();
                this.resetPlayer();
                this.updateUI();
            }

            gameLoop = () => {
                this.update();
                this.draw();
                requestAnimationFrame(this.gameLoop);
            };
        }

        let game;

        window.addEventListener('load', () => {
            game = new CityParkourGame();
            
            // 自動檢測移動設備
            if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                document.getElementById('mobileControls').classList.add('visible');
            }
        });

        function toggleMobileControls() {
            document.getElementById('mobileControls').classList.toggle('visible');
        }

        function clearBestScore() {
            if (confirm('確定要清除最高分記錄嗎？')) {
                localStorage.removeItem('bestScore');
                game.bestScore = 0;
                game.updateUI();
                alert('最高分記錄已清除！');
            }
        }
    </script>
</body>
</html>
