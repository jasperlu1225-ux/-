<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城市跑酷</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .wrapper {
            width: 100%;
            max-width: 1000px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .title {
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 32px;
            font-weight: bold;
        }

        canvas {
            width: 100%;
            height: auto;
            display: block;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
        }

        .stats {
            background: #222;
            color: white;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            font-size: 18px;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-label {
            font-weight: bold;
            color: #aaa;
        }

        .stat-value {
            font-size: 24px;
            color: #4CAF50;
            font-weight: bold;
        }

        .buttons {
            background: #333;
            padding: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            background: linear-gradient(to right, #4CAF50, #45a049);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .mobile-controls {
            display: none;
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            gap: 20px;
        }

        .mobile-controls.visible {
            display: flex;
        }

        .touch-btn {
            width: 70px;
            height: 70px;
            background: rgba(76, 175, 80, 0.8);
            border: 3px solid white;
            border-radius: 50%;
            color: white;
            font-size: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            touch-action: manipulation;
        }

        .touch-btn:active {
            background: rgba(76, 175, 80, 1);
            transform: scale(0.9);
        }

        #gameOverModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #gameOverModal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            min-width: 350px;
        }

        .modal-content h1 {
            font-size: 48px;
            color: #e74c3c;
            margin-bottom: 30px;
        }

        .modal-content p {
            font-size: 22px;
            color: #333;
            margin: 15px 0;
        }

        .modal-content button {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 18px;
        }

        @media (max-width: 768px) {
            .title {
                font-size: 24px;
                padding: 15px;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .buttons {
                padding: 15px;
                gap: 8px;
            }

            button {
                padding: 10px 16px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="title">🏙️ 城市跑酷 🏃‍♂️</div>
        
        <div style="position: relative; width: 100%; padding-bottom: 66.67%;">
            <canvas id="gameCanvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></canvas>
            <div class="mobile-controls" id="mobileControls">
                <div class="touch-btn" id="leftBtn">⬅️</div>
                <div class="touch-btn" id="jumpBtn">⬆️</div>
                <div class="touch-btn" id="rightBtn">➡️</div>
            </div>
        </div>

        <div class="stats">
            <div class="stat">
                <span class="stat-label">分數</span>
                <span class="stat-value" id="scoreText">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">生命值</span>
                <span class="stat-value" id="healthText">3</span>
            </div>
            <div class="stat">
                <span class="stat-label">關卡</span>
                <span class="stat-value" id="levelText">1</span>
            </div>
            <div class="stat">
                <span class="stat-label">檢查點</span>
                <span class="stat-value" id="checkpointText">0</span>
            </div>
        </div>

        <div class="buttons">
            <button onclick="gameEngine.pause()">⏸️ 暫停</button>
            <button onclick="toggleMobileBtn()">📱 移動按鈕</button>
            <button onclick="gameEngine.restart()">🔄 重開始</button>
        </div>
    </div>

    <div id="gameOverModal">
        <div class="modal-content">
            <h1>遊戲結束</h1>
            <p>最終分數: <strong id="finalScore">0</strong></p>
            <p>通過檢查點: <strong id="finalCheckpoint">0</strong></p>
            <p>最高關卡: <strong id="finalLevel">1</strong></p>
            <button onclick="gameEngine.restart()">重新開始</button>
        </div>
    </div>

    <script>
        // ===== 常數定義 =====
        const CANVAS = document.getElementById('gameCanvas');
        const CTX = CANVAS.getContext('2d');
        const GRAVITY = 0.5;
        const JUMP_POWER = -12;
        const PLAYER_SPEED = 6;

        // 設定 Canvas 大小
        function resizeCanvas() {
            CANVAS.width = CANVAS.offsetWidth;
            CANVAS.height = CANVAS.offsetHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // ===== 遊戲引擎 =====
        const gameEngine = {
            // 遊戲狀態
            score: 0,
            health: 3,
            level: 1,
            checkpoints: 0,
            isPaused: false,
            isGameOver: false,
            gameTime: 0,

            // 玩家對象
            player: {
                x: 50,
                y: 0,
                width: 25,
                height: 35,
                velocityX: 0,
                velocityY: 0,
                isJumping: true
            },

            // 遊戲物體
            platforms: [],
            obstacles: [],
            checkpointFlags: [],
            lastCheckpointX: null,

            // 輸入狀態
            keys: {},

            // 初始化
            init() {
                this.setupInput();
                this.generateLevel();
                this.player.y = CANVAS.height - 150;
                this.updateUI();
                this.gameLoop();
            },

            // 設定輸入
            setupInput() {
                // 鍵盤
                document.addEventListener('keydown', (e) => {
                    this.keys[e.key] = true;
                });
                document.addEventListener('keyup', (e) => {
                    this.keys[e.key] = false;
                });

                // 觸摸按鈕
                const bindTouchBtn = (btnId, key) => {
                    const btn = document.getElementById(btnId);
                    btn.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        this.keys[key] = true;
                    });
                    btn.addEventListener('touchend', (e) => {
                        e.preventDefault();
                        this.keys[key] = false;
                    });
                    btn.addEventListener('mousedown', () => this.keys[key] = true);
                    btn.addEventListener('mouseup', () => this.keys[key] = false);
                };

                bindTouchBtn('leftBtn', 'Left');
                bindTouchBtn('rightBtn', 'Right');
                bindTouchBtn('jumpBtn', 'Jump');
            },

            // 生成關卡
            generateLevel() {
                this.platforms = [];
                this.obstacles = [];
                this.checkpointFlags = [];

                // 起始平台
                this.platforms.push({
                    x: 0,
                    y: CANVAS.height - 100,
                    w: 150,
                    h: 20
                });

                // 生成關卡物體
                const platformGap = 130;
                const levelLength = 60;

                for (let i = 1; i < levelLength; i++) {
                    const px = 150 + i * platformGap;
                    const py = Math.random() * (CANVAS.height - 300) + 150;

                    // 平台
                    this.platforms.push({
                        x: px,
                        y: py,
                        w: 60 + Math.random() * 50,
                        h: 18
                    });

                    // 檢查點（每3個平台1個）
                    if (i % 3 === 0) {
                        this.checkpointFlags.push({
                            x: px + 20,
                            y: py - 50,
                            w: 30,
                            h: 40,
                            collected: false
                        });
                    }

                    // 障礙物（從第4個平台開始）
                    if (i > 3) {
                        const random = Math.random();

                        if (random < 0.25) {
                            // 汽車
                            this.obstacles.push({
                                type: 'car',
                                x: px + Math.random() * CANVAS.width,
                                y: py - 50,
                                w: 55,
                                h: 28,
                                speed: 4,
                                direction: Math.random() > 0.5 ? 1 : -1
                            });
                        } else if (random < 0.5) {
                            // 敵人
                            this.obstacles.push({
                                type: 'enemy',
                                x: px,
                                y: py - 60,
                                w: 28,
                                h: 38,
                                speed: 2,
                                minX: px - 100,
                                maxX: px + 100,
                                direction: 1
                            });
                        } else if (random < 0.75) {
                            // 陷阱
                            this.obstacles.push({
                                type: 'trap',
                                x: px + 10,
                                y: py + 20,
                                w: 60,
                                h: 12
                            });
                        } else {
                            // 電刺
                            this.obstacles.push({
                                type: 'spike',
                                x: px + 25,
                                y: py - 18,
                                w: 12,
                                h: 18
                            });
                        }
                    }
                }
            },

            // 更新遊戲狀態
            update() {
                if (this.isPaused || this.isGameOver) return;

                // 玩家移動
                this.player.velocityX = 0;
                if (this.keys['ArrowLeft'] || this.keys['a'] || this.keys['Left']) {
                    this.player.velocityX = -PLAYER_SPEED;
                }
                if (this.keys['ArrowRight'] || this.keys['d'] || this.keys['Right']) {
                    this.player.velocityX = PLAYER_SPEED;
                }
                this.player.x += this.player.velocityX;

                // 重力
                this.player.velocityY += GRAVITY;
                this.player.y += this.player.velocityY;

                // 邊界
                if (this.player.x < 0) this.player.x = 0;
                if (this.player.x + this.player.width > CANVAS.width) {
                    this.player.x = CANVAS.width - this.player.width;
                }

                // 平台碰撞
                let onGround = false;
                for (let p of this.platforms) {
                    if (this.checkCollision(this.player, p) && this.player.velocityY >= 0) {
                        this.player.y = p.y - this.player.height;
                        this.player.velocityY = 0;
                        this.player.isJumping = false;
                        onGround = true;
                    }
                }

                // 跳躍
                if ((this.keys[' '] || this.keys['w'] || this.keys['ArrowUp'] || this.keys['Jump']) && 
                    !this.player.isJumping && onGround) {
                    this.player.velocityY = JUMP_POWER;
                    this.player.isJumping = true;
                }

                // 檢查點碰撞
                for (let flag of this.checkpointFlags) {
                    if (!flag.collected && this.checkCollision(this.player, flag)) {
                        flag.collected = true;
                        this.checkpoints++;
                        this.score += 100;
                        this.lastCheckpointX = flag.x;
                    }
                }

                // 障礙物更新
                for (let obs of this.obstacles) {
                    if (obs.type === 'car') {
                        obs.x += obs.speed * obs.direction;
                        if (obs.x > CANVAS.width + 50) obs.x = -60;
                        if (obs.x < -60) obs.x = CANVAS.width + 50;
                    } else if (obs.type === 'enemy') {
                        obs.x += obs.speed * obs.direction;
                        if (obs.x < obs.minX || obs.x > obs.maxX) {
                            obs.direction *= -1;
                        }
                    }

                    // 碰撞檢測
                    if (this.checkCollision(this.player, obs)) {
                        this.takeDamage();
                    }
                }

                // 掉出屏幕
                if (this.player.y > CANVAS.height) {
                    this.takeDamage();
                }

                // 得分增加
                this.score += 0.1;

                // 等級提升
                if (this.checkpoints > 0 && this.checkpoints % 4 === 0) {
                    this.level = Math.floor(this.checkpoints / 4) + 1;
                }

                this.gameTime++;
                this.updateUI();

                // 檢查遊戲結束
                if (this.health <= 0) {
                    this.gameOver();
                }
            },

            // 碰撞檢測
            checkCollision(player, obj) {
                return (
                    player.x < obj.x + obj.w &&
                    player.x + player.width > obj.x &&
                    player.y < obj.y + obj.h &&
                    player.y + player.height > obj.y
                );
            },

            // 扣血
            takeDamage() {
                this.health--;
                this.score = Math.max(0, this.score - 25);
                this.resetPlayer();
            },

            // 重置玩家位置
            resetPlayer() {
                if (this.lastCheckpointX !== null) {
                    this.player.x = this.lastCheckpointX;
                } else {
                    this.player.x = 50;
                }
                this.player.y = CANVAS.height - 150;
                this.player.velocityY = 0;
                this.player.velocityX = 0;
            },

            // 繪製遊戲
            draw() {
                // 清空背景
                CTX.fillStyle = 'rgba(135, 206, 235, 0.5)';
                CTX.fillRect(0, 0, CANVAS.width, CANVAS.height);

                // 繪製平台
                CTX.fillStyle = '#32CD32';
                CTX.strokeStyle = '#000';
                CTX.lineWidth = 2;
                for (let p of this.platforms) {
                    CTX.fillRect(p.x, p.y, p.w, p.h);
                    CTX.strokeRect(p.x, p.y, p.w, p.h);
                }

                // 繪製檢查點
                CTX.font = '30px Arial';
                for (let flag of this.checkpointFlags) {
                    if (!flag.collected) {
                        CTX.fillText('🚩', flag.x, flag.y + 30);
                    }
                }

                // 繪製障礙物
                for (let obs of this.obstacles) {
                    if (obs.type === 'car') {
                        CTX.fillText('🚗', obs.x, obs.y + 28);
                    } else if (obs.type === 'enemy') {
                        CTX.fillText('👾', obs.x, obs.y + 35);
                    } else if (obs.type === 'trap') {
                        CTX.fillText('⚠️', obs.x + 20, obs.y + 12);
                    } else if (obs.type === 'spike') {
                        CTX.fillText('⚡', obs.x, obs.y + 16);
                    }
                }

                // 繪製玩家
                CTX.fillText('🏃', this.player.x, this.player.y + 30);
            },

            // 更新 UI
            updateUI() {
                document.getElementById('scoreText').textContent = Math.floor(this.score);
                document.getElementById('healthText').textContent = this.health;
                document.getElementById('levelText').textContent = this.level;
                document.getElementById('checkpointText').textContent = this.checkpoints;
            },

            // 暫停
            pause() {
                this.isPaused = !this.isPaused;
            },

            // 遊戲結束
            gameOver() {
                this.isGameOver = true;
                document.getElementById('gameOverModal').classList.add('show');
                document.getElementById('finalScore').textContent = Math.floor(this.score);
                document.getElementById('finalCheckpoint').textContent = this.checkpoints;
                document.getElementById('finalLevel').textContent = this.level;
            },

            // 重新開始
            restart() {
                this.score = 0;
                this.health = 3;
                this.level = 1;
                this.checkpoints = 0;
                this.isGameOver = false;
                this.isPaused = false;
                this.lastCheckpointX = null;
                document.getElementById('gameOverModal').classList.remove('show');
                this.generateLevel();
                this.resetPlayer();
                this.updateUI();
            },

            // 遊戲循環
            gameLoop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.gameLoop());
            }
        };

        // 切換移動按鈕
        function toggleMobileBtn() {
            document.getElementById('mobileControls').classList.toggle('visible');
        }

        // 啟動遊戲
        window.addEventListener('load', () => {
            gameEngine.init();
            
            // 自動檢測移動設備
            if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                document.getElementById('mobileControls').classList.add('visible');
            }
        });
    </script>
</body>
</html>
