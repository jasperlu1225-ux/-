<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城市跑酷 - City Parkour</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .game-container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .game-header {
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            padding: 15px 20px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
        }

        #gameCanvas {
            width: 100%;
            height: 600px;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 50%, #98FF98 100%);
            position: relative;
            overflow: hidden;
            display: block;
        }

        .game-stats {
            background: #333;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-around;
            font-size: 18px;
            font-weight: bold;
            flex-wrap: wrap;
            gap: 20px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-label {
            font-size: 14px;
            color: #aaa;
        }

        .stat-value {
            font-size: 24px;
            color: #4CAF50;
        }

        .game-controls {
            background: #444;
            padding: 15px 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            background: linear-gradient(to right, #4CAF50, #45a049);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .mobile-buttons {
            display: none;
            position: absolute;
            bottom: 30px;
            width: 100%;
            justify-content: space-around;
            padding: 0 20px;
            z-index: 100;
        }

        .mobile-buttons.show {
            display: flex;
        }

        .mobile-btn {
            width: 70px;
            height: 70px;
            background: rgba(76, 175, 80, 0.8);
            border: 3px solid white;
            border-radius: 50%;
            color: white;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            transition: all 0.1s;
        }

        .mobile-btn:active {
            background: rgba(76, 175, 80, 1);
            transform: scale(0.95);
        }

        #gameOverScreen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        #gameOverScreen.show {
            display: flex;
        }

        .game-over-content {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            min-width: 300px;
        }

        .game-over-content h2 {
            font-size: 48px;
            color: #e74c3c;
            margin-bottom: 20px;
        }

        .game-over-content p {
            font-size: 20px;
            color: #333;
            margin: 15px 0;
        }

        .game-over-content button {
            margin-top: 20px;
            background: linear-gradient(to right, #3498db, #2980b9);
        }

        .info-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 50;
        }

        @media (max-width: 768px) {
            #gameCanvas {
                height: 500px;
            }

            .game-stats {
                flex-direction: column;
                gap: 10px;
            }

            .stat-item {
                justify-content: space-between;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">🏙️ 城市跑酷 - City Parkour 🏃</div>
        
        <div id="gameCanvas">
            <div class="info-panel">
                <div>關卡: <span id="levelDisplay">1</span></div>
                <div>檢查點: <span id="checkpointDisplay">0</span></div>
            </div>
            <div class="mobile-buttons" id="mobileButtons">
                <div class="mobile-btn" id="leftBtn">⬅️</div>
                <div class="mobile-btn" id="jumpBtn">⬆️</div>
                <div class="mobile-btn" id="rightBtn">➡️</div>
            </div>
            <div id="gameOverScreen">
                <div class="game-over-content">
                    <h2>遊戲結束!</h2>
                    <p>最終分數: <span id="finalScore">0</span></p>
                    <p>通過檢查點: <span id="finalCheckpoints">0</span></p>
                    <p>最高關卡: <span id="finalLevel">1</span></p>
                    <button onclick="game.restart()">重新開始</button>
                </div>
            </div>
        </div>

        <div class="game-stats">
            <div class="stat-item">
                <span class="stat-label">💯 分數</span>
                <span class="stat-value" id="scoreDisplay">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">❤️ 生命</span>
                <span class="stat-value" id="healthDisplay">3</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">⚡ 速度等級</span>
                <span class="stat-value" id="speedDisplay">1</span>
            </div>
        </div>

        <div class="game-controls">
            <button onclick="game.togglePause()">⏸️ 暫停/繼續</button>
            <button onclick="toggleMobileControls()">📱 移動控制</button>
            <button onclick="game.restart()">🔄 重新開始</button>
        </div>
    </div>

    <script>
        class CityParkourGame {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.canvasWidth = this.canvas.offsetWidth;
                this.canvasHeight = this.canvas.offsetHeight;

                // 遊戲狀態
                this.isPaused = false;
                this.isGameOver = false;
                this.score = 0;
                this.health = 3;
                this.level = 1;
                this.checkpointsCollected = 0;
                this.gameTime = 0;

                // 物理引擎
                this.gravity = 0.5;
                this.platformSpeed = -4;

                // 玩家對象
                this.player = {
                    x: 80,
                    y: this.canvasHeight - 150,
                    width: 25,
                    height: 35,
                    velocityX: 0,
                    velocityY: 0,
                    isJumping: false,
                    color: '#FF6B6B'
                };

                // 鍵盤輸入
                this.keys = {};

                // 遊戲對象
                this.platforms = [];
                this.obstacles = [];
                this.checkpoints = [];
                this.particles = [];
                this.lastCheckpointX = null;

                // 初始化
                this.setupInputListeners();
                this.generateLevel();
                this.gameLoop();
            }

            setupInputListeners() {
                // 鍵盤控制
                document.addEventListener('keydown', (e) => {
                    this.keys[e.key] = true;
                });
                document.addEventListener('keyup', (e) => {
                    this.keys[e.key] = false;
                });

                // 觸摸控制
                const leftBtn = document.getElementById('leftBtn');
                const rightBtn = document.getElementById('rightBtn');
                const jumpBtn = document.getElementById('jumpBtn');

                leftBtn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    this.keys['ArrowLeft'] = true;
                });
                leftBtn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    this.keys['ArrowLeft'] = false;
                });

                rightBtn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    this.keys['ArrowRight'] = true;
                });
                rightBtn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    this.keys['ArrowRight'] = false;
                });

                jumpBtn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    this.keys[' '] = true;
                });
                jumpBtn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    this.keys[' '] = false;
                });

                // 滑鼠點擊控制（調試用）
                leftBtn.addEventListener('mousedown', () => this.keys['ArrowLeft'] = true);
                leftBtn.addEventListener('mouseup', () => this.keys['ArrowLeft'] = false);
                rightBtn.addEventListener('mousedown', () => this.keys['ArrowRight'] = true);
                rightBtn.addEventListener('mouseup', () => this.keys['ArrowRight'] = false);
                jumpBtn.addEventListener('mousedown', () => this.keys[' '] = true);
                jumpBtn.addEventListener('mouseup', () => this.keys[' '] = false);
            }

            generateLevel() {
                this.platforms = [];
                this.obstacles = [];
                this.checkpoints = [];

                // 起始平台
                this.platforms.push({
                    x: 0,
                    y: this.canvasHeight - 100,
                    width: 200,
                    height: 25,
                    color: '#32CD32'
                });

                // 生成關卡內容
                const platformGap = 120 + this.level * 5;
                const levelLength = 50 + this.level * 10;

                for (let i = 1; i < levelLength; i++) {
                    const x = 200 + i * platformGap;
                    const y = Math.random() * (this.canvasHeight - 250) + 150;

                    // 平台
                    this.platforms.push({
                        x: x,
                        y: y,
                        width: 70 + Math.random() * 40,
                        height: 20,
                        color: '#32CD32'
                    });

                    // 檢查點（每4個平台1個）
                    if (i > 0 && i % 4 === 0) {
                        this.checkpoints.push({
                            x: x + 30,
                            y: y - 60,
                            width: 25,
                            height: 50,
                            collected: false,
                            id: i
                        });
                    }

                    // 障礙物（從第3個平台開始）
                    if (i > 2) {
                        const obstacleChance = Math.random();

                        if (obstacleChance < 0.25) {
                            // 汽車
                            this.obstacles.push({
                                type: 'car',
                                x: x + Math.random() * this.canvasWidth,
                                y: y - 50,
                                width: 60,
                                height: 30,
                                speed: 3 + this.level * 0.5,
                                direction: Math.random() > 0.5 ? 1 : -1,
                                color: '#FF0000'
                            });
                        } else if (obstacleChance < 0.5) {
                            // 敵人
                            this.obstacles.push({
                                type: 'enemy',
                                x: x,
                                y: y - 70,
                                width: 30,
                                height: 40,
                                patrolStart: x,
                                patrolWidth: 150,
                                speed: 1.5 + this.level * 0.2,
                                direction: 1,
                                color: '#9C27B0'
                            });
                        } else if (obstacleChance < 0.75) {
                            // 陷阱
                            this.obstacles.push({
                                type: 'trap',
                                x: x + 20,
                                y: y + 22,
                                width: 65,
                                height: 15,
                                color: '#FFD700'
                            });
                        } else {
                            // 跳刺
                            this.obstacles.push({
                                type: 'spike',
                                x: x + 30,
                                y: y - 20,
                                width: 10,
                                height: 20,
                                color: '#FF6347'
                            });
                        }
                    }
                }

                // 重置玩家位置
                this.resetPlayer();
            }

            resetPlayer() {
                if (this.lastCheckpointX !== null) {
                    this.player.x = this.lastCheckpointX;
                    this.player.y = this.canvasHeight - 150;
                } else {
                    this.player.x = 80;
                    this.player.y = this.canvasHeight - 150;
                }
                this.player.velocityY = 0;
                this.player.velocityX = 0;
            }

            update() {
                if (this.isPaused || this.isGameOver) return;

                // 玩家移動
                this.player.velocityX = 0;
                if (this.keys['ArrowLeft'] || this.keys['a']) {
                    this.player.velocityX = -6;
                }
                if (this.keys['ArrowRight'] || this.keys['d']) {
                    this.player.velocityX = 6;
                }

                this.player.x += this.player.velocityX;

                // 重力
                this.player.velocityY += this.gravity;
                this.player.y += this.player.velocityY;

                // 邊界檢查
                if (this.player.x < 0) this.player.x = 0;
                if (this.player.x + this.player.width > this.canvasWidth) {
                    this.player.x = this.canvasWidth - this.player.width;
                }

                // 平台碰撞
                let isOnGround = false;
                for (let platform of this.platforms) {
                    if (
                        this.player.velocityY >= 0 &&
                        this.player.y + this.player.height >= platform.y &&
                        this.player.y + this.player.height <= platform.y + platform.height + 5 &&
                        this.player.x + this.player.width > platform.x &&
                        this.player.x < platform.x + platform.width
                    ) {
                        this.player.y = platform.y - this.player.height;
                        this.player.velocityY = 0;
                        this.player.isJumping = false;
                        isOnGround = true;
                    }
                }

                // 跳躍
                if ((this.keys[' '] || this.keys['w'] || this.keys['ArrowUp']) && !this.player.isJumping && isOnGround) {
                    this.player.velocityY = -12;
                    this.player.isJumping = true;
                }

                // 檢查點碰撞
                for (let checkpoint of this.checkpoints) {
                    if (!checkpoint.collected && this.checkCollision(this.player, checkpoint)) {
                        checkpoint.collected = true;
                        this.checkpointsCollected++;
                        this.score += 100;
                        this.lastCheckpointX = checkpoint.x;
                        this.createParticles(checkpoint.x, checkpoint.y, '🚩');
                    }
                }

                // 障礙物更新和碰撞
                for (let obstacle of this.obstacles) {
                    // 更新障礙物位置
                    if (obstacle.type === 'car') {
                        obstacle.x += obstacle.speed * obstacle.direction;
                        if (obstacle.x > this.canvasWidth + 50) obstacle.x = -60;
                        if (obstacle.x < -60) obstacle.x = this.canvasWidth + 50;
                    } else if (obstacle.type === 'enemy') {
                        obstacle.x += obstacle.speed * obstacle.direction;
                        if (obstacle.x - obstacle.patrolStart > obstacle.patrolWidth) {
                            obstacle.direction = -1;
                        }
                        if (obstacle.x - obstacle.patrolStart < 0) {
                            obstacle.direction = 1;
                        }
                    }

                    // 碰撞檢測
                    if (this.checkCollision(this.player, obstacle)) {
                        this.takeDamage();
                    }
                }

                // 掉出屏幕
                if (this.player.y > this.canvasHeight) {
                    this.takeDamage();
                }

                // 增加得分
                this.score += 0.05;
                this.gameTime++;

                // 等級提升
                if (this.checkpointsCollected > 0 && this.checkpointsCollected % 5 === 0) {
                    this.level = Math.floor(this.checkpointsCollected / 5) + 1;
                }

                // 更新粒子
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    this.particles[i].life--;
                    this.particles[i].x += this.particles[i].vx;
                    this.particles[i].y += this.particles[i].vy;
                    this.particles[i].vy += 0.3;
                    if (this.particles[i].life <= 0) {
                        this.particles.splice(i, 1);
                    }
                }

                this.updateUI();

                // 遊戲結束檢查
                if (this.health <= 0) {
                    this.gameOver();
                }
            }

            checkCollision(rect1, rect2) {
                return (
                    rect1.x < rect2.x + rect2.width &&
                    rect1.x + rect1.width > rect2.x &&
                    rect1.y < rect2.y + rect2.height &&
                    rect1.y + rect1.height > rect2.y
                );
            }

            takeDamage() {
                this.health--;
                this.score = Math.max(0, this.score - 30);
                this.createParticles(this.player.x, this.player.y, '💥');
                this.resetPlayer();
            }

            createParticles(x, y, emoji) {
                for (let i = 0; i < 5; i++) {
                    this.particles.push({
                        x: x,
                        y: y,
                        vx: (Math.random() - 0.5) * 4,
                        vy: (Math.random() - 0.5) * 4,
                        life: 30,
                        emoji: emoji
                    });
                }
            }

            draw() {
                const canvas = document.getElementById('gameCanvas');
                
                // 清空舊的繪製物體
                const drawn = canvas.querySelectorAll('.game-object');
                drawn.forEach(obj => obj.remove());

                // 繪製平台
                for (let platform of this.platforms) {
                    this.drawRect(platform.x, platform.y, platform.width, platform.height, platform.color, 'platform');
                }

                // 繪製檢查點
                for (let checkpoint of this.checkpoints) {
                    if (!checkpoint.collected) {
                        this.drawObject(checkpoint.x, checkpoint.y, '🚩', 'checkpoint');
                    }
                }

                // 繪製障礙物
                for (let obstacle of this.obstacles) {
                    if (obstacle.type === 'car') {
                        this.drawObject(obstacle.x, obstacle.y, '🚗', 'obstacle');
                    } else if (obstacle.type === 'enemy') {
                        this.drawObject(obstacle.x, obstacle.y, '👾', 'obstacle');
                    } else if (obstacle.type === 'trap') {
                        this.drawObject(obstacle.x, obstacle.y, '⚠️', 'obstacle');
                    } else if (obstacle.type === 'spike') {
                        this.drawObject(obstacle.x, obstacle.y, '⚡', 'obstacle');
                    }
                }

                // 繪製粒子
                for (let particle of this.particles) {
                    this.drawObject(particle.x, particle.y, particle.emoji, 'particle', particle.life / 30);
                }

                // 繪製玩家
                this.drawObject(this.player.x, this.player.y, '🏃', 'player');
            }

            drawRect(x, y, width, height, color, className = '') {
                const div = document.createElement('div');
                div.className = 'game-object ' + className;
                div.style.position = 'absolute';
                div.style.left = x + 'px';
                div.style.top = y + 'px';
                div.style.width = width + 'px';
                div.style.height = height + 'px';
                div.style.backgroundColor = color;
                div.style.border = '2px solid #000';
                div.style.borderRadius = '3px';
                document.getElementById('gameCanvas').appendChild(div);
            }

            drawObject(x, y, emoji, className = '', opacity = 1) {
                const div = document.createElement('div');
                div.className = 'game-object ' + className;
                div.style.position = 'absolute';
                div.style.left = x + 'px';
                div.style.top = y + 'px';
                div.style.fontSize = '30px';
                div.style.width = '30px';
                div.style.height = '30px';
                div.style.display = 'flex';
                div.style.alignItems = 'center';
                div.style.justifyContent = 'center';
                div.style.opacity = opacity;
                div.textContent = emoji;
                document.getElementById('gameCanvas').appendChild(div);
            }

            updateUI() {
                document.getElementById('scoreDisplay').textContent = Math.floor(this.score);
                document.getElementById('healthDisplay').textContent = this.health;
                document.getElementById('levelDisplay').textContent = this.level;
                document.getElementById('checkpointDisplay').textContent = this.checkpointsCollected;
                document.getElementById('speedDisplay').textContent = this.level;
            }

            togglePause() {
                this.isPaused = !this.isPaused;
            }

            gameOver() {
                this.isGameOver = true;
                document.getElementById('gameOverScreen').classList.add('show');
                document.getElementById('finalScore').textContent = Math.floor(this.score);
                document.getElementById('finalCheckpoints').textContent = this.checkpointsCollected;
                document.getElementById('finalLevel').textContent = this.level;
            }

            restart() {
                this.score = 0;
                this.health = 3;
                this.level = 1;
                this.checkpointsCollected = 0;
                this.gameTime = 0;
                this.isGameOver = false;
                this.lastCheckpointX = null;
                document.getElementById('gameOverScreen').classList.remove('show');
                this.generateLevel();
                this.updateUI();
            }

            gameLoop = () => {
                this.update();
                this.draw();
                requestAnimationFrame(this.gameLoop);
            };
        }

        let game;
        window.addEventListener('load', () => {
            game = new CityParkourGame();
            
            // 檢測移動設備
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            if (isMobile) {
                document.getElementById('mobileButtons').classList.add('show');
            }
        });

        function toggleMobileControls() {
            document.getElementById('mobileButtons').classList.toggle('show');
        }
    </script>
</body>
</html>
